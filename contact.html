<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – My Website</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">My Website</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button id="theme-toggle" aria-label="Switch light or dark mode">🌙</button>
  </header>

  <main class="page">
    <h1>Contact</h1>
    <p>Send me a message. (This form is just for practice: nothing is sent anywhere yet.)</p>

    <form id="contact-form">
      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button class="button" type="submit">Send</button>
    </form>
    <p id="form-result" hidden></p>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Natour99</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
