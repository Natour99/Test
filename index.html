<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
           display: grid; place-items: center; background: #f4f4f5; color: #18181b; }
    main { text-align: center; padding: 16px; }
    button { font-size: 1rem; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from the Test repo</h1>
    <p>You clicked <span id="count">0</span> times.</p>
    <button id="btn">Click me</button>
  </main>
  <script>
    let n = 0;
    document.getElementById('btn').onclick = () => {
      document.getElementById('count').textContent = ++n;
    };
  </script>
</body>
</html>
